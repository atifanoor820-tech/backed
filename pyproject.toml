[project]
name = "abbas-agent"
version = "0.1.0"
description = "Abbas (Abbad) - voice-controlled desktop agent: agent service, voice pipeline, tools"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    # Dashi drives ShowMyTrades with Playwright (locally, or over CDP to a remote browser when deployed).
    "playwright>=1.45",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
]
desktop = [
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pyautogui>=0.9.54",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
